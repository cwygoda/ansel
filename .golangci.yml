version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: error-strings
        - name: errorf
        - name: context-as-argument
        - name: indent-error-flow
        - name: unexported-return
        - name: var-naming
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - errcheck

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/cwygoda/ansel
